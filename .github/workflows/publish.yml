name: Publish to npm

# Publishing is driven purely by pushing a version tag, e.g.
#   npm version patch      # bumps package.json + creates the commit and tag
#   git push --follow-tags
#
# The tag MUST match the version in package.json (v1.2.3 <-> "1.2.3"); the
# workflow fails loudly otherwise so a mis-tagged release can never ship.

on:
  push:
    tags:
      - "v*"

# Least privilege: read the repo, and mint an OIDC token for provenance.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Cheap and dependency-free: catches a broken tag before we contact npm.
      - name: Verify the tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            echo "Run 'npm version <bump>' so the commit and tag stay in sync."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # Refuse to overwrite an immutable published version (npm would 403 anyway).
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published"
            exit 1
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
